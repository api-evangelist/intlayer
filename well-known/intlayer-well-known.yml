generated: '2026-09-03'
method: probed
source: live probes of intlayer.org, back.intlayer.org and mcp.intlayer.org
note: >-
  intlayer.org answers HTTP 200 with an SPA shell for every unknown path, so a 200 there proves
  nothing on its own; only /.well-known/api-catalog returned a real document
  (application/linkset+json, RFC 9727). back.intlayer.org 404s honestly and serves genuine OAuth
  2.0 authorization-server (RFC 8414) and protected-resource (RFC 9728) metadata — the AS
  metadata carries a non-standard agent_auth block pointing agents at the auth guide
  https://intlayer.org/auth.md. mcp.intlayer.org 404s every well-known path. No security.txt,
  openid-configuration, ai-plugin.json or agent card is served on any host.
