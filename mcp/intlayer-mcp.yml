description: >-
  Official Intlayer MCP server, shipped both as a hosted remote server (Streamable HTTP at
  https://mcp.intlayer.org — public, no authentication, free to use, with a stated concurrent
  connection limit) and as a local stdio package (npx -y @intlayer/mcp). Exposes 27 tools:
  five documentation tools (get-doc-list, get-doc, get-doc-by-slug, fetch-doc-chunks,
  review-doc-blocks) and twenty-two CMS management tools covering dictionaries, tags,
  organizations, projects and environments. The provider's own RFC 9727 api-catalog at
  https://intlayer.org/.well-known/api-catalog lists the server (item href
  https://mcp.intlayer.org/sse), and its llms.txt recommends it to agents. CMS write tools
  operate on the authenticated user's selected organization/project; the docs tools work
  anonymously. The full tools/list response (verbatim, with inputSchemas) is saved at
  mcp/intlayer-mcp-tools.json.
