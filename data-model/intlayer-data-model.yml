entities:
- name: Organization
  description: Top-level account grouping; the authenticated user belongs to one or more.
- name: Project
  description: >-
    CMS project inside an organization; access keys (client credentials) are issued per
    project.
- name: Environment
  description: >-
    Per-project environment (production default) holding its own dictionaries and
    configuration; supports migration between environments.
- name: Dictionary
  description: The core content unit — keyed multilingual content, listed/CRUDed per project.
- name: Tag
  description: Organization-level label used to group dictionaries and provide AI context.
