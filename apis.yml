    CORRECTED (2026-09-03 enrichment pass): Intlayer does have a real, reachable API surface the
    first pass missed. The llms.txt itself recommends the official MCP server (remote
    https://mcp.intlayer.org — anonymous tools/list returned 27 tools with schemas — and stdio
    npx -y @intlayer/mcp); intlayer.org serves a genuine RFC 9727 api-catalog linkset;
    back.intlayer.org serves RFC 8414 + RFC 9728 OAuth metadata whose agent_auth block points at
    a machine-readable agent auth guide (intlayer.org/auth.md) for the CMS API at
    back.intlayer.org/api/*. Still true: no OpenAPI/Swagger/GraphQL contract is published
    anywhere (probed again on all three hosts). A VulnerabilityDisclosure artifact briefly wired
    by the security-programs probe on 2026-09-03 was removed the same day: its evidence page
    (intlayer.org/vulnerability-disclosure) is the site's SPA catch-all shell, not a disclosure
    page.
