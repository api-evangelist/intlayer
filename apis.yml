aid: intlayer
name: Intlayer
description: >-
  Intlayer is an internationalisation (i18n) framework for modern web applications, providing one
  way to manage multilingual content across React, Next.js, Vue, Svelte, Solid, Nuxt and Astro.
  Beyond the open-source (Apache-2.0) framework it operates a hosted CMS API at
  back.intlayer.org secured with OAuth 2.0 client credentials, publishes an RFC 9727 API catalog,
  a machine-readable agent authentication guide (auth.md), and ships an official MCP server both
  hosted (mcp.intlayer.org) and as a stdio package (@intlayer/mcp), alongside extensive
  documentation written for agents as well as humans.
