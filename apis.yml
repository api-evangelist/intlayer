aid: intlayer
name: Intlayer
description: >-
  Intlayer is an internationalisation (i18n) framework for modern web applications, providing one
  way to manage multilingual content across React, Next.js, Vue, Svelte, Solid, Nuxt and Astro. It
  operates a backend at back.intlayer.org and publishes extensive documentation written for agents
  as well as humans.
