apis:
- name: Intlayer CMS API
  description: >-
    Backend API for the hosted Intlayer CMS at back.intlayer.org — dictionaries, projects,
    organizations, environments and tags. Secured with OAuth 2.0 client_credentials (per-project
    access keys issued at app.intlayer.org); errors use a consistent JSON envelope. No OpenAPI is
    published — the surface is consumed through the first-party @intlayer/api SDK, the intlayer
    CLI, and the official MCP server, and documented for agents at intlayer.org/auth.md.
  image: https://intlayer.org/github-social-preview.png
